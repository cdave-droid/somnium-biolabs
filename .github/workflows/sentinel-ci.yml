name: sentinel-ci

on:
  push:
    paths: ["sentinel/**", ".github/workflows/sentinel-ci.yml"]
  pull_request:
    paths: ["sentinel/**", ".github/workflows/sentinel-ci.yml"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest numpy
      - name: Validate content package
        run: python sentinel/tools/validate_content.py sentinel/content/packages/demo-2026.07.0
      - name: Gate tests G0-G5 (Python)
        run: python -m pytest sentinel/engine-py/tests/ -q
      - name: Golden intent assertions
        run: python sentinel/tools/gen_golden.py --check
      - name: Signature coverage report
        run: python sentinel/tools/coverage_report.py
      - name: Red-team suite (§7.4)
        run: python sentinel/analysis/run_redteam.py
      - name: Local pipeline end-to-end
        run: python sentinel/tools/local_pipeline.py

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix sentinel/engine-ts
      - name: Build + unit tests (TypeScript)
        run: npm test --prefix sentinel/engine-ts

  parity:
    # Release gate G4(c)/G5: BOTH runtimes byte-identical on the golden suite.
    runs-on: ubuntu-latest
    needs: [python, typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix sentinel/engine-ts
      - run: npm run build --prefix sentinel/engine-ts
      - run: bash sentinel/tools/check_parity.sh
