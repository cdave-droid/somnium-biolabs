[project]
name = "sentinel-engine"
version = "1.0.0"
description = "SENTINEL — deterministic rule-based monitoring & triage engine (Python reference runtime)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
